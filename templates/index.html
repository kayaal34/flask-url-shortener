<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shorty – URL shortener</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>Shorty</h1>
    <p class="tagline">Paste a long link, get a short one.</p>
    <form method="post">
      <input type="url" name="url" placeholder="https://example.com/a/very/long/link" required>
      <button type="submit">Shorten</button>
    </form>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    {% if short_url %}
      <p class="result">Your link: <a href="{{ short_url }}">{{ short_url }}</a></p>
    {% endif %}
  </main>
</body>
</html>
