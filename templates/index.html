<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shorty – URL shortener</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>Shorty</h1>
    <p class="tagline">Paste a long link, get a short one. <a href="{{ url_for('stats') }}">See stats</a></p>
    <form method="post">
      <input type="url" name="url" placeholder="https://example.com/a/very/long/link" required>
      <input type="text" name="alias" placeholder="custom alias (optional)" class="alias">
      <select name="expires_in_days" class="expiry" aria-label="Link expiry">
        <option value="">Never expires</option>
        <option value="1">Expires in 1 day</option>
        <option value="7">Expires in 7 days</option>
        <option value="30">Expires in 30 days</option>
      </select>
      <button type="submit">Shorten</button>
    </form>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    {% if short_url %}
      <p class="result">Your link: <a href="{{ short_url }}">{{ short_url }}</a><br>
        <small>Preview it without following: <a href="{{ short_url }}+">{{ short_url }}+</a></small></p>
    {% endif %}
  </main>
</body>
</html>
